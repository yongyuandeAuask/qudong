name: build

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
  workflow_dispatch:
    inputs:
      ddk_release:
        description: 'ghcr.io/ylarod/ddk image tag suffix (release date)'
        required: false
        default: '20251104'
        type: string
      hide_kgsl_strength:
        description: 'HIDE_KGSL_STRENGTH override (0..3). Empty = default (0).'
        required: false
        default: ''
        type: string

jobs:
  userspace:
    name: build userspace arm64-v8a
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build C++ client
        run: |
          set -eux
          cmake -S client -B out/client \
            -DCMAKE_TOOLCHAIN_FILE="${ANDROID_NDK_HOME}/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-30 \
            -DANDROID_STL=c++_static \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build out/client -j"$(nproc)"
      - uses: actions/upload-artifact@v4
        with:
          name: userspace-arm64-v8a
          path: |
            out/client/my-driver-client
            out/client/my-driver-test
          if-no-files-found: error
          retention-days: 30

  build:
    name: build ${{ matrix.kmi }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        kmi:
          - android12-5.10
          - android13-5.10
          - android13-5.15
          - android14-5.15
          - android14-6.1
          - android15-6.6
          - android16-6.12
    container:
      image: ghcr.io/ylarod/ddk:${{ matrix.kmi }}-${{ inputs.ddk_release || '20251104' }}
      options: --privileged
    env:
      DRIVER_NAME: my-driver
      HIDE_SELF_MODULE: '1'
      HIDE_VMAP: '1'
      HIDE_TASK: '1'
      HIDE_KGSL_STRENGTH: ${{ inputs.hide_kgsl_strength || '0' }}
    steps:
      - uses: actions/checkout@v4

      - name: Fetch Dispa1r wxshadow + hook subsystem (CI-side)
        run: |
          mkdir -p driver/src/arm64_decode driver/src/wxshadow
          BASE=https://raw.githubusercontent.com/Dispa1r/Integrated_kernel_module/master/lsdriver
          for f in arm64_decode.c arm64_decode.h arm64_decode_base.c arm64_decode_branch.c \
                   arm64_decode_ldst.c arm64_decode_simd.c arm64_decode_sme.c arm64_decode_sve.c; do
            curl -fsSL "$BASE/arm64_decode/$f" -o "driver/src/arm64_decode/$f"
          done
          for f in inline_hook_frame.h wxshadow.h wxshadow_internal.h wxshadow_hook_types.h \
                   wxshadow_core.c wxshadow_pgtable.c wxshadow_handlers.c wxshadow_bp.c wxshadow_deps.c \
                   io_struct.h; do
            curl -fsSL "$BASE/$f" -o "driver/src/wxshadow/$f"
          done
          # 复制适配头到 wxshadow 目录（deps.c 需要）
          cp driver/src/export_fun.h driver/src/wxshadow/
          cp driver/src/arm64_reg.h driver/src/wxshadow/
          cp driver/src/lsdriver_log.h driver/src/wxshadow/
          ls -l driver/src/wxshadow

      - name: Build ${{ env.DRIVER_NAME }}.ko
        working-directory: driver
        run: |
          set -eux
          make -j"$(nproc)"
          ls -la "${DRIVER_NAME}.ko"

      - name: Stage artefact
        working-directory: driver
        run: |
          set -eux
          mkdir -p "${GITHUB_WORKSPACE}/out"
          OUT="${GITHUB_WORKSPACE}/out/${DRIVER_NAME}-${{ matrix.kmi }}.ko"
          cp "${DRIVER_NAME}.ko" "$OUT"
          if command -v llvm-strip >/dev/null 2>&1; then llvm-strip -d "$OUT"; fi
          ls -la "$OUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.DRIVER_NAME }}-${{ matrix.kmi }}.ko
          path: out/${{ env.DRIVER_NAME }}-${{ matrix.kmi }}.ko
          if-no-files-found: error
          retention-days: 30
